{{- if .Values.gateway.enabled }}
apiVersion: {{ .Values.gateway.apiVersion | default "gateway.networking.k8s.io/v1" }}
kind: Gateway
metadata:
  name: {{ default (include "https-wrench.fullname" .) .Values.gateway.name }}
  labels:
    {{- include "https-wrench.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{- if hasPrefix "gateway.networking.k8s.io" (default "gateway.networking.k8s.io/v1" .Values.gateway.apiVersion) }}
  gatewayClassName: {{ .Values.gateway.gatewayClassName | default "istio" }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
{{- else }}
  selector:
    {{- toYaml (default (dict "istio" "gateway-ingress") .Values.gateway.selector) | nindent 4 }}
  servers:
    {{- toYaml (default .Values.gateway.listeners .Values.gateway.servers) | nindent 4 }}
{{- end }}
{{- end }}
